version: 2

models:
  - name: mart_nba_leader_stats
    description: Analytics for NBA player leadership statistics
    tests:
      - unique:
          column_name: "game_id || '-' || player_name || '-' || leader_type"
      - not_null:
          column_name: game_id
    columns:
      - name: player_name
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              regex: '^[A-Za-z\s\.-]+$'

      - name: leader_type
        tests:
          - not_null
          - accepted_values:
              values: ['POINTS', 'REBOUNDS', 'ASSISTS', 'RATING']

      - name: stat_value
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100

      - name: avg_stat_value
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 50

      - name: season_high
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100

      - name: last_5_games_avg
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 50

      - name: games_as_leader
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 82

      # Custom tests for stat-specific validation
      - name: stat_validation
        tests:
          - dbt_utils.expression_is_true:
              expression: "
                (leader_type = 'POINTS' and stat_value <= 100) or
                (leader_type = 'REBOUNDS' and stat_value <= 40) or
                (leader_type = 'ASSISTS' and stat_value <= 30) or
                (leader_type = 'RATING' and stat_value <= 50)"

      - name: performance_metrics
        tests:
          - dbt_utils.expression_is_true:
              expression: "avg_stat_value <= season_high"
          - dbt_utils.expression_is_true:
              expression: "exceptional_performance in (0, 1)"
